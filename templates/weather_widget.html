{% load static %}
<div style="grid-column: 1/3; background: linear-gradient(135deg, #a1c4fd, #c2e9fb); padding: 16px; border-radius: 8px; box-shadow: 0 5px 10px 0 rgba(150, 150, 200, 0.8)">
    <div style="display: flex; justify-content: space-between; align-items: center">
        <h3>Welcome Home, {{ request.user.first_name }}</h3>
        <div class="collapsable-menu" style="position: relative">
            <div style="background: rgba(200 200 200 / 0.6); border-radius: 8px; padding: 8px; display: flex; justify-content: center; align-items: center">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                     class="bi bi-three-dots-vertical"
                     viewBox="0 0 16 16">
                    <path d="M9.5 13a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0"></path>
                </svg>
            </div>

            <div class="collapsable-options"
                 style="position: absolute; gap: 4px; right: 0; padding: 8px; display: none; background: white; border-radius: 8px; background: rgba(240 240 240 / 0.95); flex-direction: column">

                <a class="btn btn-light"
                   href="{% url 'remove-widget' pk=selected_house.id %}?type=widget&id={{ widget.id }}">Remove From
                    Dashboard</a>

            </div>
        </div>
    </div>

    <div class="d-flex justify-content-between">
        <div>
            <p style="margin: 0" id="weather-city">{{ selected_house.address }}</p>
            <div class="d-inline-flex align-items-center gap-2">
                <img style="aspect-ratio: 1; height: 48px" id="weather-img" src="{{ icon }}">
                <h5 style="margin: 0" id="weather-temperature">{{ temp_c }}&deg;C</h5>
            </div>
            <p style="margin: 0; font-weight: 300" id="weather-condition">{{ condition }}</p>
        </div>
        <div>
            <h5 style="text-align: end" id="date"></h5>
            <h4 style="text-align: end" id="time"></h4>
        </div>
    </div>
    <script defer src="{% static 'scripts/time.js' %}"></script>
</div>
