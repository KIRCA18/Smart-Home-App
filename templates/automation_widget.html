<div style="padding: 16px; background: white; border-radius: 8px">
    <div style="display: flex; justify-content: space-between; align-items: center">
        <div>
            <div style="display: flex;">
                <h4>{{ automation.name }}</h4>
            </div>
            <small>{{ automation.description }}</small>
        </div>
        <div style="display: flex; gap: 4px">
            <label id="automation-switch-{{ automation.id }}" class="switch">
                <input {% if automation.is_active %} checked {% endif %} type="checkbox">
                <span class="slider round"></span>
            </label>
        <script>
            let automationSwitch{{ automation.id }} = document.getElementById("automation-switch-{{ automation.id }}")
            automationSwitch{{ automation.id }}.addEventListener("change", (e) => {
                const url = new URL(`{% url 'toggle-automation' pk=selected_house.id %}`, window.location.origin)
                url.searchParams.set("automation", {{ automation.id }})
                url.searchParams.set("is_active", e.target.checked)
                window.location.href = url.toString()
            })
        </script>
            <div class="collapsable-menu" style="position: relative">
                <div style="background: rgba(200 200 200 / 0.6); border-radius: 8px; padding: 8px; display: flex; justify-content: center; align-items: center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                         class="bi bi-three-dots-vertical"
                         viewBox="0 0 16 16">
                        <path d="M9.5 13a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0"></path>
                    </svg>
                </div>

                <div class="collapsable-options"
                     style="position: absolute; gap: 4px; right: 0; padding: 8px; display: none; background: white; border-radius: 8px; background: rgba(240 240 240 / 0.95); flex-direction: column">
                    <a href="{% url 'delete-automation' pk=selected_house.id %}?automation={{ automation.id }}" class="btn btn-light">Delete Automation Rule</a>
                </div>
            </div>
        </div>
    </div>
    <h5>Trigger</h5>
    <p>{{ automation.get_condition_str }}</p>
    <hr>
    <h5>Actions ({{ automation.actions.all|length }})</h5>
    {% for action in automation.actions.all %}
        <small>{{ action }}</small><br>
    {% endfor %}
    <br>


</div>
